let toastTimeout = null;
function showToast(text, duration = 2500) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => el.classList.remove('show'), duration);
}

function getLevelForExp(exp) {
    if (exp < 60) return 1;
    if (exp < 140) return 2;
    if (exp < 260) return 3;
    if (exp < 420) return 4;
    if (exp < 620) return 5;
    if (exp < 860) return 6;
    if (exp < 1140) return 7;
    if (exp < 1460) return 8;
    if (exp < 1820) return 9;
    if (exp < 2220) return 10;
    return 11;
}
function getLevelLabel(level) { return level <= 10 ? level : 'Pro'; }

function updateProProgress() {
    const exp = STATE.exp;
    const level = STATE.level;
    const nextExp = level >= 11 ? Infinity : [60,140,260,420,620,860,1140,1460,1820,2220][level-1] || Infinity;
    const prevExp = level === 1 ? 0 : [0,60,140,260,420,620,860,1140,1460,1820][level-1] || 0;
    const progress = nextExp === Infinity ? 100 : Math.min(100, ((exp - prevExp) / (nextExp - prevExp) * 100));
    const expEl = document.getElementById('expDisplay');
    const progEl = document.getElementById('proProgressDisplay');
    if (expEl) expEl.textContent = exp;
    if (progEl) progEl.textContent = (level >= 11) ? 'Pro' : Math.round(progress) + '%';
}

function addExp(amount) {
    if (!currentUser) return;
    const reduced = Math.floor(amount / 3);
    if (reduced < 1) return;
    STATE.exp += reduced;
    const newLevel = getLevelForExp(STATE.exp);
    if (newLevel !== STATE.level) {
        STATE.level = newLevel;
        showToast('🎉 Уровень повышен до ' + getLevelLabel(STATE.level) + '!');
        giveLevelReward(newLevel);
        checkAllAchievements();
        saveStateToFirebase();
    }
    updateUI();
}

        case 6: reward = { cases: CASES.map(c => ({ id: c.id, count: 1 })), coins: 150 }; break;
        case 7: reward = { cases: [...CASES.map(c => ({ id: c.id, count: 1 })), { id: 'cities', count: 2 }], coins: 150 }; break;
        case 8: reward = { cases: [{ id: 'muzhiki1', count: 5 }, { id: 'muzhiki2', count: 5 }], coins: 200 }; break;
        case 9: reward = { cases: CASES.map(c => ({ id: c.id, count: 2 })), coins: 200 }; break;

}

let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function playTone(freq, duration, type = 'sine', volume = 0.1) {
    if (!STATE.settings.sound && !STATE.settings.sfx) return;
    const vol = (STATE.settings.sfxVolume || 1) * volume;
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}

function getEmail(nick) { return nick + '@casettp.firebaseapp.com'; }

function loginUser(nick, password) {
    const status = document.getElementById('loginError');
    status.textContent = '';
    addLog('⏳ Попытка входа для ' + nick);
    const email = getEmail(nick);

    fetch(AUTH_URL + ':signInWithPassword?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, returnSecureToken: true })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            addLog('❌ Ошибка: ' + data.error.message);
            status.textContent = '❌ ' + data.error.message;
            status.className = 'error';
            document.getElementById('loadingStatus').classList.add('hidden');
            return;
        }
        const uid = data.localId;
        const idToken = data.idToken;
        addLog('✅ Аутентификация успешна, UID: ' + uid);
        return fetch(DB_URL + '/users/' + uid + '.json?auth=' + idToken)
            .then(res => res.json())
            .then(profile => {
                if (!profile || profile.nickname !== nick) {
                    addLog('❌ Профиль не найден или ник не совпадает');
                    status.textContent = '❌ Неверный ник или пароль';
                    status.className = 'error';
                    document.getElementById('loadingStatus').classList.add('hidden');
                    return;
                }
                addLog('✅ Профиль загружен, ник: ' + profile.nickname);
                currentUser = { uid, data: profile, idToken };
                onAuthSuccess();
            });
    })
    .catch(err => {
        addLog('❌ Исключение: ' + err.message);
        status.textContent = '❌ ' + err.message;
        status.className = 'error';
        document.getElementById('loadingStatus').classList.add('hidden');
    });
}

function registerUser(nick, password) {
    const status = document.getElementById('loginError');
    status.textContent = '';
    addLog('⏳ Регистрация для ' + nick);
    if (password.length < 6) {
        status.textContent = '❌ Пароль не менее 6 символов';
        status.className = 'error';
        return;
    }
    const email = getEmail(nick);

    fetch(DB_URL + '/nicknames/' + nick + '.json')
        .then(res => res.json())
        .then(data => {
            if (data) {
                addLog('❌ Ник занят');
                status.textContent = '❌ Ник уже занят';
                status.className = 'error';
                document.getElementById('loadingStatus').classList.add('hidden');

                body: JSON.stringify({ email, password, returnSecureToken: true })
            });
        })
        .then(res => {
            if (!res) return;

                if (data.error) {

                    status.textContent = '❌ ' + data.error.message;
                    status.className = 'error';

                const profile = {

                    maxElo: 1000,

                    totalSpent: 0,

    const uid = currentUser.uid;
    const idToken = currentUser.idToken;

        balance: STATE.balance,
        totalEarned: STATE.totalEarned,
        totalSpent: STATE.totalSpent,
        maxBalance: STATE.maxBalance,
        elo: STATE.elo,
        maxElo: STATE.maxElo,
        casesOpened: STATE.casesOpened,
        maxCasesOpened: STATE.maxCasesOpened,
        totalClicks: STATE.totalClicks,
        inventory: STATE.inventory,
        achievements: STATE.achievements,
        settings: STATE.settings,
        morols: STATE.morols,
        plane: STATE.plane,
        exp: STATE.exp,
        level: STATE.level,
        clan: STATE.clan,
        freeOpens: STATE.freeOpens,
        promoUsed: STATE.promoUsed,
        eloBoosted: STATE.eloBoosted,
        marketBuys: STATE.marketBuys,
        marketSells: STATE.marketSells,
        nickChanged: STATE.nickChanged,

        topElo: STATE.topElo,

function getCaseById(id) { return CASES.find(c => c.id === id); }

function rollItem(caseData) {
    const total = caseData.items.reduce((s, i) => s + i.weight, 0);
    let r = Math.random() * total;
    for (const item of caseData.items) {
        r -= item.weight;
        if (r <= 0) return { ...item };
    }
    return { ...caseData.items[0] };
}

function openCase(caseId) {
    if (STATE.isOpening) return;
    const caseData = getCaseById(caseId);
    if (!caseData) return;
    let price = caseData.price;
    let free = false;
    if (STATE.freeOpens > 0) {
        free = true;
        STATE.freeOpens--;
        price = 0;
    } else if (STATE.balance < price) {
        showToast('Недостаточно монет! Нужно ' + price + ' ₽');
        return;
    }
    STATE.isOpening = true;
    STATE.currentCaseId = caseId;
    sfxCaseOpenStart();
    const modal = document.getElementById('caseModal');
    const track = document.getElementById('slotTrack');
    const resultDisplay = document.getElementById('resultDisplay');
    const reopenBtn = document.getElementById('reopenBtn');
    const sellResultBtn = document.getElementById('sellResultBtn');

    document.getElementById('modalCaseName').textContent = caseData.name;
    modal.classList.add('open');
    reopenBtn.style.display = 'none';
    sellResultBtn.style.display = 'none';

    const allItems = caseData.items;
    let spinItems = [];
    for (let i=0; i<30; i++) spinItems.push(pickRandom(allItems));
    const result = rollItem(caseData);
    spinItems.push(result);
    for (let i=0; i<10; i++) spinItems.push(pickRandom(allItems));
    spinItems.push(result);

    track.innerHTML = '';
    spinItems.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'slot-item';
        div.dataset.idx = idx;
        div.innerHTML = `<span class="emoji">${item.emoji}</span> ${item.name}`;
        track.appendChild(div);
    });

    const itemWidth = 120;
    const visibleCount = 3;
    const containerWidth = itemWidth * visibleCount;
    document.getElementById('slotContainer').style.width = containerWidth + 'px';
    document.getElementById('slotContainer').style.margin = '0 auto';

    let startTime = null;
    const duration = 2800;
    const centerIndex = spinItems.length - 2;
    const endOffset = -(centerIndex - 1) * itemWidth;

    function animateScroll(time) {
        if (!startTime) startTime = time;
        const progress = Math.min((time - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentOffset = 0 + (endOffset - 0) * eased;
        track.style.transform = 'translateX(' + currentOffset + 'px)';
        const items = track.querySelectorAll('.slot-item');
        const centerIdx = Math.round(-currentOffset / itemWidth) + 1;
        items.forEach((el, i) => {
            el.classList.remove('active', 'highlight');
            if (i === centerIdx) el.classList.add('active');
            if (i === spinItems.length - 1 && progress >= 0.99) el.classList.add('highlight');
        });
        if (progress < 1) {
            requestAnimationFrame(animateScroll);
        } else {
            track.style.transform = 'translateX(' + endOffset + 'px)';
            const finalResult = spinItems[centerIndex];
            resultDisplay.innerHTML = `
                <span class="big-emoji">${finalResult.emoji}</span>
                <span class="result-name">${finalResult.name}</span>
                <span class="result-rare">${finalResult.rarity || 'обычное'}</span>
            `;
            if (!free) {
                STATE.balance -= price;
                STATE.totalSpent += price;
            } else {
                showToast('🎁 Бесплатное открытие!');
            }
            STATE.casesOpened += 1;
            if (STATE.casesOpened > STATE.maxCasesOpened) STATE.maxCasesOpened = STATE.casesOpened;
            const entry = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2,6),
                name: finalResult.name,
                emoji: finalResult.emoji,
                rarity: finalResult.rarity || 'обычное',
                caseId: caseData.id,
                acquired: Date.now(),
            };
            STATE.inventory.push(entry);
            const key = finalResult.name + '|||' + finalResult.emoji;
            STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) + 1;
            addExp(10);
            updateUI();
            checkAllAchievements();
            sfxCaseOpenFinish();
            STATE.isOpening = false;
            reopenBtn.style.display = 'block';
            sellResultBtn.style.display = 'block';
            sellResultBtn.textContent = 'Продать за ' + (Math.floor(caseData.price * 0.5)) + ' ₽';
            sellResultBtn.onclick = function() {
                const price = Math.floor(caseData.price * 0.5);
                const idx = STATE.inventory.findIndex(item => item.id === entry.id);
                if (idx !== -1) {
                    STATE.inventory.splice(idx, 1);
                    STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                    if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                    STATE.balance += price;
                    STATE.totalEarned += price;
                    if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
                    showToast('✅ Продано: ' + finalResult.emoji + ' ' + finalResult.name + ' за ' + price + ' ₽');
                    sfxMarketSell();
                    updateUI();
                    saveStateToFirebase();
                    renderInventory();
                    closeCaseModal();
                }
            };
            reopenBtn.onclick = function() {
                closeCaseModal();
                setTimeout(() => openCase(caseId), 100);
            };
            saveStateToFirebase();
        }
    }
    requestAnimationFrame(animateScroll);

    document.getElementById('caseModalClose').onclick = function() {
        closeCaseModal();
    };

    modal.onclick = function(e) {
        if (e.target === modal) closeCaseModal();
    };
}

function closeCaseModal() {
    const modal = document.getElementById('caseModal');
    modal.classList.remove('open');
    document.getElementById('slotTrack').innerHTML = '';
    document.getElementById('resultDisplay').innerHTML = `
        <span class="big-emoji">🎲</span>
        <span class="result-name" style="color:#6a8aaa;">Ожидайте...</span>
        <span class="result-rare"></span>
    `;
    document.getElementById('reopenBtn').style.display = 'none';
    document.getElementById('sellResultBtn').style.display = 'none';
    STATE.isOpening = false;
}

function showChances(caseData) {
    const modal = document.getElementById('chanceModal');
    const list = document.getElementById('chanceList');
    let html = '';
    const total = caseData.items.reduce((s,i) => s + i.weight, 0);
    for (const item of caseData.items) {
        const percent = (item.weight / total * 100).toFixed(1);
        html += `<div class="chance-item"><span class="name">${item.emoji} ${item.name}</span><span class="percent">${percent}%</span></div>`;
    }
    list.innerHTML = html;
    modal.classList.add('open');
    document.getElementById('chanceClose').onclick = () => modal.classList.remove('open');
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };
    sfxClick();
}

function renderInventory() {
    try {
        const grid = document.getElementById('inventoryGrid');
        const countEl = document.getElementById('invCount');
        const entries = Object.entries(STATE.itemsCount);
        if (entries.length === 0) {
            grid.innerHTML = `<div class="inv-empty">Инвентарь пуст</div>`;
            countEl.textContent = '0';
            return;
        }
        let html = '', total = 0;
        for (const [key, count] of entries) {
            const [name, emoji] = key.split('|||');
            const found = STATE.inventory.find(it => it.name === name && it.emoji === emoji);
            const rarity = found ? found.rarity : 'обычное';
            const caseId = found ? found.caseId : null;
            let sellPrice = 20;
            if (caseId && caseId !== 'market' && caseId !== 'unknown') {
                const caseData = getCaseById(caseId);
                if (caseData) sellPrice = Math.floor(caseData.price * 0.5);
            }
            html += `<div class="inv-item">
                <span class="item-emoji">${emoji}</span>
                <div class="item-name">${name}</div>
                <div class="item-count">×${count}</div>
                <div class="item-rarity">${rarity}</div>
                <div class="btn-group">
                    <button class="sell-btn" data-item-key="${key}" data-sell-price="${sellPrice}">Продать за ${sellPrice} ₽</button>
                    <button class="trash-btn" data-item-key="${key}">Выбросить</button>
                    <button class="clear-all-btn" data-item-key="${key}">Очистить все</button>
                </div>
            </div>`;
            total += count;
        }
        grid.innerHTML = html;
        countEl.textContent = total;

        grid.querySelectorAll('.sell-btn').forEach(btn => {
            btn.onclick = function() {
                const key = this.dataset.itemKey;
                const price = parseInt(this.dataset.sellPrice);
                const [name, emoji] = key.split('|||');
                if ((STATE.itemsCount[key] || 0) < 1) {
                    showToast('Нет предмета');
                    return;
                }
                const idx = STATE.inventory.findIndex(item => item.name === name && item.emoji === emoji);
                if (idx === -1) { showToast('Ошибка'); return; }
                STATE.inventory.splice(idx, 1);
                STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                STATE.balance += price;
                STATE.totalEarned += price;
                if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
                showToast('✅ Продано: ' + emoji + ' ' + name + ' за ' + price + ' ₽');
                sfxMarketSell();
                addExp(1);
                updateUI();
                saveStateToFirebase();
                renderInventory();
            };
        });

        grid.querySelectorAll('.trash-btn').forEach(btn => {
            btn.onclick = function() {
                const key = this.dataset.itemKey;
                const [name, emoji] = key.split('|||');
                if ((STATE.itemsCount[key] || 0) < 1) {
                    showToast('Нет предмета');
                    return;
                }
                const idx = STATE.inventory.findIndex(item => item.name === name && item.emoji === emoji);
                if (idx === -1) { showToast('Ошибка'); return; }
                STATE.inventory.splice(idx, 1);
                STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                showToast('🗑️ Выброшено: ' + emoji + ' ' + name);
                updateUI();
                saveStateToFirebase();
                renderInventory();
            };
        });

        grid.querySelectorAll('.clear-all-btn').forEach(btn => {
            btn.onclick = function() {
                const key = this.dataset.itemKey;
                const [name, emoji] = key.split('|||');
                const count = STATE.itemsCount[key] || 0;
                if (count === 0) { showToast('Нет предмета'); return; }
                if (!confirm(`Удалить все ${count} карточек "${name}"?`)) return;
                STATE.inventory = STATE.inventory.filter(item => !(item.name === name && item.emoji === emoji));
                delete STATE.itemsCount[key];
                showToast(`Очищено: ${emoji} ${name} (${count} шт.)`);
                updateUI();
                saveStateToFirebase();
                renderInventory();
            };
        });

        document.getElementById('clearAllInventoryBtn').onclick = clearAllInventory;
    } catch(e) { console.warn('renderInventory error:', e); addLog('⚠️ Ошибка рендера инвентаря: ' + e.message); }
}

async function clearAllInventory() {
    if (!currentUser) { showToast('❌ Не авторизованы'); return; }
    if (STATE.inventory.length === 0) { showToast('Инвентарь пуст'); return; }
    const password = prompt('Введите пароль:');
    if (!password) return;
    const email = currentUser.data.nickname + '@casettp.firebaseapp.com';
    fetch(AUTH_URL + ':signInWithPassword?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, returnSecureToken: true })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            showToast('❌ Неверный пароль');
            return;
        }
        STATE.inventory = [];
        STATE.itemsCount = {};
        showToast('✅ Инвентарь очищен');
        updateUI();
        saveStateToFirebase();
        renderInventory();
    })
    .catch(err => showToast('❌ Ошибка: ' + err.message));
}

function renderMarket() {
    const container = document.getElementById('marketContent');
    const activeTab = document.querySelector('.market-tabs .active')?.dataset.marketTab || 'buy';
    const sort = document.getElementById('marketSort').value;

    fetch(DB_URL + '/market.json')
        .then(res => res.json())
        .then(data => {
            let lots = [];
            if (data) {
                for (const key in data) {
                    const lot = data[key];
                    lot._id = key;
                    lots.push(lot);
                }
            }
            STATE.marketListings = lots;

            let filtered = lots;
            if (activeTab === 'my') {
                filtered = lots.filter(l => l.sellerUid === STATE.uid);
            } else if (activeTab === 'buy') {
                filtered = lots.filter(l => l.sellerUid !== STATE.uid);
            }

            switch(sort) {
                case 'price_asc': filtered.sort((a,b) => a.price - b.price); break;
                case 'price_desc': filtered.sort((a,b) => b.price - a.price); break;
                case 'rarity_desc': filtered.sort((a,b) => (b.rarityWeight||0) - (a.rarityWeight||0)); break;
                case 'rarity_asc': filtered.sort((a,b) => (a.rarityWeight||0) - (b.rarityWeight||0)); break;
            }

            let html = '';
            if (activeTab === 'sell') {
                html += `<div class="market-sell-form">
                    <h3>Выставить лот</h3>
                    <div class="row">
                        <select id="sellItemSelect">
                            <option value="">Выберите предмет</option>
                            ${Object.keys(STATE.itemsCount).map(key => {
                                const [name, emoji] = key.split('|||');
                                const count = STATE.itemsCount[key];
                                return `<option value="${key}">${emoji} ${name} (${count} шт.)</option>`;
                            }).join('')}
                        </select>
                        <input type="number" id="sellPriceInput" placeholder="Цена" min="1" value="50">
                        <button id="sellSubmitBtn">Выставить</button>
                    </div>
                </div>`;
            }

            if (filtered.length === 0 && activeTab !== 'sell') {
                html += `<div class="inv-empty">Нет лотов</div>`;
            } else {
                for (const lot of filtered) {
                    const isMine = lot.sellerUid === STATE.uid;
                    html += `<div class="market-listing">
                        <div class="info">
                            <span class="emoji">${lot.emoji}</span>
                            <div class="details">
                                <div class="name">${lot.name}</div>
                                <div class="seller">${isMine ? 'Вы' : lot.sellerName || 'Игрок'}</div>
                            </div>
                        </div>
                        <div class="price">
                            ${lot.price} ₽
                            ${!isMine && activeTab !== 'my' ? `<button data-lot-id="${lot._id}" class="buy-lot-btn">Купить</button>` : ''}
                            ${isMine ? `<button data-lot-id="${lot._id}" class="remove-lot-btn">✕</button>` : ''}
                        </div>
                    </div>`;
                }
            }

            container.innerHTML = html;

            container.querySelectorAll('.buy-lot-btn').forEach(btn => {
                btn.onclick = function() {
                    const lotId = this.dataset.lotId;
                    buyLot(lotId);
                };
            });
            container.querySelectorAll('.remove-lot-btn').forEach(btn => {
                btn.onclick = function() {
                    const lotId = this.dataset.lotId;
                    removeLot(lotId);
                };
            });

            const sellBtn = document.getElementById('sellSubmitBtn');
            if (sellBtn) {
                sellBtn.onclick = function() {
                    const select = document.getElementById('sellItemSelect');
                    const key = select.value;
                    if (!key) { showToast('Выберите предмет'); return; }
                    const price = parseInt(document.getElementById('sellPriceInput').value);
                    if (isNaN(price) || price < 1) { showToast('Укажите цену'); return; }
                    const [name, emoji] = key.split('|||');
                    const count = STATE.itemsCount[key] || 0;
                    if (count < 1) { showToast('Нет предмета'); return; }

                    const idx = STATE.inventory.findIndex(item => item.name === name && item.emoji === emoji);
                    if (idx === -1) { showToast('Ошибка'); return; }
                    const item = STATE.inventory[idx];

                    const lot = {
                        name: item.name,
                        emoji: item.emoji,
                        rarity: item.rarity || 'обычное',
                        price: price,
                        sellerUid: STATE.uid,
                        sellerName: STATE.nickname,
                        timestamp: Date.now(),
                        rarityWeight: ['ширп','обычное','необычное','редкое','сверхредкое','эпическое','эксклюзив'].indexOf(item.rarity) || 0
                    };
                    fetch(DB_URL + '/market.json?auth=' + currentUser.idToken, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(lot)
                    })
                    .then(res => res.json())
                    .then(() => {
                        STATE.inventory.splice(idx, 1);
                        STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                        if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                        STATE.marketSells++;
                        showToast('✅ Лот выставлен!');
                        sfxMarketSell();
                        updateUI();
                        saveStateToFirebase();
                        renderInventory();
                        renderMarket();
                    })
                    .catch(err => showToast('❌ Ошибка: ' + err.message));
                };
            }
        })
        .catch(err => container.innerHTML = '<div class="inv-empty">Ошибка загрузки рынка</div>');
}

function buyLot(lotId) {
    if (!currentUser) { showToast('Войдите'); return; }
    const lot = STATE.marketListings.find(l => l._id === lotId);
    if (!lot) { showToast('Лот не найден'); return; }
    if (lot.sellerUid === STATE.uid) { showToast('Это ваш лот'); return; }
    if (STATE.balance < lot.price) { showToast('Недостаточно монет'); return; }

    STATE.balance -= lot.price;
    STATE.totalSpent += lot.price;

    const entry = {
        id: Date.now() + '_' + Math.random().toString(36).slice(2,6),
        name: lot.name,
        emoji: lot.emoji,
        rarity: lot.rarity || 'обычное',
        caseId: 'market',
        acquired: Date.now()
    };
    STATE.inventory.push(entry);
    const key = lot.name + '|||' + lot.emoji;
    STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) + 1;
    STATE.marketBuys++;

    fetch(DB_URL + '/market/' + lotId + '.json?auth=' + currentUser.idToken, {
        method: 'DELETE'
    })
    .then(() => {
        showToast('✅ Покупка успешна!');
        sfxMarketBuy();
        updateUI();
        saveStateToFirebase();
        renderInventory();
        renderMarket();
    })
    .catch(err => showToast('❌ Ошибка: ' + err.message));
}

function removeLot(lotId) {
    if (!confirm('Снять лот?')) return;
    fetch(DB_URL + '/market/' + lotId + '.json?auth=' + currentUser.idToken, {
        method: 'DELETE'
    })
    .then(() => {
        showToast('Лот снят');
        renderMarket();
    })
    .catch(err => showToast('❌ Ошибка: ' + err.message));
}

function renderRating() {
    const container = document.getElementById('ratingContent');
    fetch(DB_URL + '/users.json')
        .then(res => res.json())
        .then(data => {
            if (!data) { container.innerHTML = '<div class="inv-empty">Нет игроков</div>'; return; }
            let players = [];
            for (const uid in data) {
                const p = data[uid];
                if (!p.nickname) continue;
                players.push({
                    name: p.nickname,
                    clan: p.clan || '',
                    isYou: (uid === STATE.uid),
                    elo: p.elo || 0,
                    casesOpened: p.casesOpened || 0,
                    balance: p.balance || 0,
                    totalEarned: p.totalEarned || 0,
                    totalClicks: p.totalClicks || 0,
                    level: p.level || 1
                });
            }
            players.sort((a,b) => b.elo - a.elo);
            let html = '<div class="rating-list">';
            let rank = 1;
            for (const p of players.slice(0, 20)) {
                const isYou = p.isYou;
                let posClass = '';
                if (rank === 1) posClass = 'gold';
                else if (rank === 2) posClass = 'silver';
                else if (rank === 3) posClass = 'bronze';
                const isPro = p.level >= 11;
                const nameClass = isPro ? 'gold-nick' : '';
                html += `<div class="rank-item ${isYou ? 'you' : ''} ${nameClass}">
                    <span class="pos ${posClass}">${rank}</span>
                    <span class="name">${isYou ? '⭐ ' : ''}${p.name}${p.clan ? ' [' + p.clan + ']' : ''}</span>
                    <span class="value">${p.elo}</span>
                    ${isYou ? '<span style="font-size:12px; color:#666;">вы</span>' : ''}
                    ${isPro ? '<span style="font-size:12px; color:#f0d070; margin-left:6px;">👑 Pro</span>' : ''}
                </div>`;
                rank++;
            }
            html += '</div>';
            container.innerHTML = html;
        })
        .catch(err => container.innerHTML = '<div class="inv-empty">Ошибка загрузки рейтинга</div>');
}

function checkAllAchievements() {
    let any = false;
    const allIds = ACHIEVEMENTS.map(a => a.id).filter(id => id !== 'allAchievements');
    for (const ach of ACHIEVEMENTS) {
        if (STATE.achievements.includes(ach.id)) continue;
        if (ach.id === 'allAchievements') continue;
        if (ach.check(STATE)) {
            STATE.achievements.push(ach.id);
            any = true;
            showToast('🏆 Достижение: ' + ach.name);
            sfxAchievement();
            addExp(25);
        }
    }
    if (!STATE.achievements.includes('allAchievements')) {
        const hasAll = allIds.every(id => STATE.achievements.includes(id));
        if (hasAll) {
            STATE.achievements.push('allAchievements');
            any = true;
            showToast('🏆 Все достижения выполнены!');
            sfxAchievement();
            addExp(100);
        }
    }
    if (any) {
        renderAchievements();
        saveStateToFirebase();
    }
}

function updateProgressDisplay() {
    const exp = STATE.exp;
    const level = STATE.level;
    const nextExp = level >= 11 ? Infinity : [60,140,260,420,620,860,1140,1460,1820,2220][level-1] || Infinity;
    const prevExp = level === 1 ? 0 : [0,60,140,260,420,620,860,1140,1460,1820][level-1] || 0;
    const currentProgress = nextExp === Infinity ? 100 : ((exp - prevExp) / (nextExp - prevExp) * 100);
    document.getElementById('progressExp').textContent = exp;
    document.getElementById('progressFill').style.width = Math.min(100, currentProgress) + '%';
    if (level >= 11) document.getElementById('progressLabel').textContent = 'Pro уровень достигнут!';
    else document.getElementById('progressLabel').textContent = `Уровень ${level} → ${level+1}`;
}

// ---- МОРОЛС ----
let morolsRunning = false;
let morolsAnimId = null;
let morolsState = {
    carX: 300, carY: 250, carWidth: 40, carHeight: 20,
    obstacles: [], coins: [],
    speed: 0, distance: 0, totalCoins: 0, maxSpeedReached: 0,
    lastTime: 0, gameOver: false,
    keys: { left: false, right: false },
};

function initMorols() {
    try {
        const canvas = document.getElementById('morolsCanvas');
        if (!canvas) return;
        canvas.width = 600; canvas.height = 300;
        document.getElementById('morolsStart').onclick = startMorols;
        document.getElementById('morolsReset').onclick = resetMorols;
        const leftBtn = document.getElementById('morolsTouchLeft');
        const rightBtn = document.getElementById('morolsTouchRight');
        function addListeners(btn, key) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); morolsState.keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); morolsState.keys[key] = false; });
            btn.addEventListener('touchcancel', () => { morolsState.keys[key] = false; });
            btn.addEventListener('mousedown', () => { morolsState.keys[key] = true; });
            btn.addEventListener('mouseup', () => { morolsState.keys[key] = false; });
            btn.addEventListener('mouseleave', () => { morolsState.keys[key] = false; });
        }
        addListeners(leftBtn, 'left');
        addListeners(rightBtn, 'right');
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { morolsState.keys.left = true; e.preventDefault(); }
            if (e.key === 'ArrowRight') { morolsState.keys.right = true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') { morolsState.keys.left = false; e.preventDefault(); }
            if (e.key === 'ArrowRight') { morolsState.keys.right = false; e.preventDefault(); }
        });
        resetMorols();
    } catch(e) { console.warn('initMorols error:', e); addLog('⚠️ Ошибка инициализации Моролс: ' + e.message); }
}

function resetMorols() {
    morolsRunning = false;
    if (morolsAnimId) { cancelAnimationFrame(morolsAnimId); morolsAnimId = null; }
    morolsState.carX = 300; morolsState.carY = 250;
    morolsState.obstacles = []; morolsState.coins = [];
    morolsState.speed = 0; morolsState.distance = 0;
    morolsState.totalCoins = 0; morolsState.maxSpeedReached = 0;
    morolsState.gameOver = false;
    morolsState.keys.left = false; morolsState.keys.right = false;
    updateMorolsUI();
    drawMorols();
    document.getElementById('morolsStart').textContent = 'Старт';
}

function startMorols() {
    if (morolsRunning) return;
    morolsRunning = true;
    morolsState.gameOver = false;
    morolsState.speed = 1;
    morolsState.distance = 0;
    morolsState.totalCoins = 0;
    morolsState.obstacles = [];
    morolsState.coins = [];
    morolsState.maxSpeedReached = 0;
    morolsState.lastTime = performance.now();
    document.getElementById('morolsStart').textContent = 'В гонке...';
    if (morolsAnimId) cancelAnimationFrame(morolsAnimId);
    morolsAnimId = requestAnimationFrame(morolsLoop);
}

async function morolsLoop(timestamp) {
    const dt = Math.min((timestamp - morolsState.lastTime) / 1000, 0.05);
    morolsState.lastTime = timestamp;
    if (!morolsRunning || morolsState.gameOver) { drawMorols(); return; }

    morolsState.speed += 0.03 * dt * 60;
    if (morolsState.speed > morolsState.maxSpeedReached) {
        morolsState.maxSpeedReached = morolsState.speed;
        if (morolsState.maxSpeedReached > STATE.morols.maxSpeed) {
            STATE.morols.maxSpeed = morolsState.maxSpeedReached;
        }
    }

    morolsState.distance += morolsState.speed * dt / 10;
    if (morolsState.distance > STATE.morols.maxDistance) {
        STATE.morols.maxDistance = morolsState.distance;
    }

    const moveSpeed = 300 * dt;
    if (morolsState.keys.left) morolsState.carX -= moveSpeed;
    if (morolsState.keys.right) morolsState.carX += moveSpeed;
    morolsState.carX = clamp(morolsState.carX, 20, 580);

    let spawnRate = 0.03;
    if (morolsState.speed > 50) spawnRate *= 1.5;
    if (Math.random() < spawnRate * dt * 60) {
        const x = Math.random() * 560 + 20;
        morolsState.obstacles.push({ x, y: 0, width: 30, height: 20, speed: (100 + morolsState.speed * 3) * 1.0 });
    }
    if (Math.random() < 0.03 * dt * 60) {
        const x = Math.random() * 560 + 20;
        morolsState.coins.push({ x, y: 0, radius: 10, speed: 80 + morolsState.speed * 2, value: rand(1, 3) });
    }

    for (let i = morolsState.obstacles.length - 1; i >= 0; i--) {
        const o = morolsState.obstacles[i];
        o.y += o.speed * dt;
        if (o.y > 300) { morolsState.obstacles.splice(i, 1); continue; }
        if (o.x < morolsState.carX + morolsState.carWidth/2 &&
            o.x + o.width > morolsState.carX - morolsState.carWidth/2 &&
            o.y < morolsState.carY + morolsState.carHeight/2 &&
            o.y + o.height > morolsState.carY - morolsState.carHeight/2) {
            morolsState.gameOver = true;
            morolsRunning = false;
            document.getElementById('morolsStart').textContent = 'Старт';
            sfxMorolsCrash();
            const maxSpeed = morolsState.maxSpeedReached;
            showToast('💥 Авария! Скорость: ' + maxSpeed.toFixed(1) + ' км/ч');
            const rewardSteps = Math.floor(maxSpeed / 5);
            if (rewardSteps > 0) {
                STATE.elo += rewardSteps;
                STATE.maxElo = Math.max(STATE.maxElo, STATE.elo);
                STATE.balance += rewardSteps * 2;
                STATE.totalEarned += rewardSteps * 2;
                if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
                showToast('🏆 +' + rewardSteps + ' Эло, +' + (rewardSteps * 2) + ' монет');
                addExp(rewardSteps);
            }
            if (morolsState.maxSpeedReached > STATE.morols.maxSpeed) STATE.morols.maxSpeed = morolsState.maxSpeedReached;
            if (morolsState.distance > STATE.morols.maxDistance) STATE.morols.maxDistance = morolsState.distance;
            STATE.morols.totalCoins += morolsState.totalCoins;
            STATE.morols.gamesPlayed = (STATE.morols.gamesPlayed || 0) + 1;
            await saveStateToFirebase();
            updateUI();
            checkAllAchievements();
            drawMorols();
            return;
        }
    }

    for (let i = morolsState.coins.length - 1; i >= 0; i--) {
        const c = morolsState.coins[i];
        c.y += c.speed * dt;
        if (c.y > 300) { morolsState.coins.splice(i, 1); continue; }
        if (Math.abs(c.x - morolsState.carX) < c.radius + morolsState.carWidth/2 &&
            Math.abs(c.y - morolsState.carY) < c.radius + morolsState.carHeight/2) {
            morolsState.coins.splice(i, 1);
            const value = c.value || 1;
            morolsState.totalCoins += value;
            STATE.balance += value;
            STATE.totalEarned += value;
            if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
            sfxMorolsCoin();
            showToast('+ ' + value + ' 🪙');
        }
    }

    updateMorolsUI();
    drawMorols();
    morolsAnimId = requestAnimationFrame(morolsLoop);
}

function drawMorols() {
    const canvas = document.getElementById('morolsCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 600, 300);
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, 0, 600, 300);
    ctx.strokeStyle = '#aaaaaa';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    ctx.beginPath(); ctx.moveTo(0, 280); ctx.lineTo(600, 280); ctx.stroke();
    ctx.setLineDash([]);
    for (const o of morolsState.obstacles) {
        ctx.fillStyle = '#cc3333';
        ctx.fillRect(o.x, o.y, o.width, o.height);
    }
    for (const c of morolsState.coins) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2);
        ctx.fillStyle = '#f0d070';
        ctx.fill();
        ctx.strokeStyle = '#aa8822';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    ctx.fillStyle = '#4a8aba';
    ctx.fillRect(morolsState.carX - morolsState.carWidth/2, morolsState.carY - morolsState.carHeight/2, morolsState.carWidth, morolsState.carHeight);
    ctx.fillStyle = '#2a4a6a';
    ctx.fillRect(morolsState.carX - morolsState.carWidth/2 + 4, morolsState.carY - morolsState.carHeight/2 - 4, 8, 4);
    ctx.fillRect(morolsState.carX + morolsState.carWidth/2 - 12, morolsState.carY - morolsState.carHeight/2 - 4, 8, 4);
    if (morolsState.gameOver) {
        ctx.fillStyle = '#ff3333';
        ctx.font = '24px Tahoma';
        ctx.textAlign = 'center';
        ctx.fillText('АВАРИЯ!', 300, 100);
    }
}

function updateMorolsUI() {
    document.getElementById('morolsSpeed').textContent = Math.round(morolsState.speed);
    document.getElementById('morolsDistance').textContent = morolsState.distance.toFixed(2);
    document.getElementById('morolsCoins').textContent = morolsState.totalCoins;
}

// ---- САМОЛЁТ ----
let planeRunning = false;
let planeAnimId = null;
let planeState = {
    planeX: 80,
    planeY: 150,
    width: 40,
    height: 30,
    vy: 0,
    obstacles: [],
    coins: [],
    score: 0,
    xp: 0,
    time: 0,
    lastTime: 0,
    gameOver: false,
    gravity: 0.08,
    jumpPower: -6,
    groundY: 270,
    ceilingY: 20,
};

function initPlane() {
    try {
        const canvas = document.getElementById('planeCanvas');
        if (!canvas) return;
        canvas.width = 600; canvas.height = 300;
        document.getElementById('planeStart').onclick = startPlane;
        document.getElementById('planeReset').onclick = resetPlane;
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); planeJump(); }
        });
        canvas.addEventListener('click', planeJump);
        resetPlane();
    } catch(e) { console.warn('initPlane error:', e); addLog('⚠️ Ошибка инициализации Самолёта: ' + e.message); }
}

function resetPlane() {
    planeRunning = false;
    if (planeAnimId) { cancelAnimationFrame(planeAnimId); planeAnimId = null; }
    planeState.planeY = 150;
    planeState.vy = 0;
    planeState.obstacles = [];
    planeState.coins = [];
    planeState.score = 0;
    planeState.xp = 0;
    planeState.time = 0;
    planeState.gameOver = false;
    document.getElementById('planeStart').textContent = 'Старт';
    updatePlaneUI();
    drawPlane();
}

function planeJump() {
    if (planeState.gameOver || !planeRunning) return;
    planeState.vy = planeState.jumpPower;
    sfxPlaneJump();
}

function startPlane() {
    if (planeRunning) return;
    planeRunning = true;
    planeState.gameOver = false;
    planeState.planeY = 150;
    planeState.vy = 0;
    planeState.obstacles = [];
    planeState.coins = [];
    planeState.score = 0;
    planeState.xp = 0;
    planeState.time = 0;
    planeState.lastTime = performance.now();
    document.getElementById('planeStart').textContent = 'В полёте...';
    if (planeAnimId) cancelAnimationFrame(planeAnimId);
    planeAnimId = requestAnimationFrame(planeLoop);
}

function planeLoop(timestamp) {
    const dt = Math.min((timestamp - planeState.lastTime) / 1000, 0.05);
    planeState.lastTime = timestamp;
    if (!planeRunning || planeState.gameOver) { drawPlane(); return; }

    planeState.time += dt;
    planeState.xp += dt * 5;
    planeState.score += dt;

    planeState.vy += planeState.gravity;
    planeState.planeY += planeState.vy;
    if (planeState.planeY < planeState.ceilingY) planeState.planeY = planeState.ceilingY;
    if (planeState.planeY > planeState.groundY) {
        planeState.planeY = planeState.groundY;
        planeState.vy = 0;
    }

    if (Math.random() < 0.015 * dt * 60) {
        const height = 20 + Math.random() * 30;
        const y = Math.random() > 0.5 ? planeState.ceilingY : planeState.groundY - height;
        planeState.obstacles.push({
            x: 600,
            y: y,
            width: 20,
            height: height,
            speed: 200 + planeState.time * 1.2,
            passed: false
        });
    }
    if (Math.random() < 0.02 * dt * 60) {
        planeState.coins.push({
            x: 600,
            y: 50 + Math.random() * 180,
            radius: 10,
            speed: 180 + planeState.time * 1.0,
            collected: false,
            value: rand(1, 5)
        });
    }

    for (let i = planeState.obstacles.length - 1; i >= 0; i--) {
        const o = planeState.obstacles[i];
        o.x -= o.speed * dt;
        if (o.x + o.width < 0) {
            planeState.obstacles.splice(i, 1);
            continue;
        }
        if (o.x < planeState.planeX + planeState.width &&
            o.x + o.width > planeState.planeX &&
            o.y < planeState.planeY + planeState.height &&
            o.y + o.height > planeState.planeY) {
            planeState.gameOver = true;
            planeRunning = false;
            document.getElementById('planeStart').textContent = 'Старт';
            sfxPlaneDie();
            STATE.plane.xp += planeState.xp;
            STATE.plane.totalCoins += planeState.score;
            if (planeState.time > STATE.plane.bestTime) STATE.plane.bestTime = planeState.time;
            STATE.balance += Math.floor(planeState.score);
            STATE.totalEarned += Math.floor(planeState.score);
            addExp(Math.floor(planeState.xp / 10) + Math.floor(planeState.time * 1.5));
            STATE.plane.gamesPlayed = (STATE.plane.gamesPlayed || 0) + 1;
            showToast('💥 Крах! XP: ' + Math.floor(planeState.xp) + ', монет: ' + Math.floor(planeState.score));
            saveStateToFirebase();
            updateUI();
            checkAllAchievements();
            drawPlane();
            updatePlaneUI();
            return;
        }
    }

    for (let i = planeState.coins.length - 1; i >= 0; i--) {
        const c = planeState.coins[i];
        c.x -= c.speed * dt;
        if (c.x + c.radius < 0) { planeState.coins.splice(i, 1); continue; }
        if (!c.collected && Math.abs(c.x - planeState.planeX - planeState.width/2) < c.radius + planeState.width/2 &&
            Math.abs(c.y - planeState.planeY - planeState.height/2) < c.radius + planeState.height/2) {
            c.collected = true;
            planeState.coins.splice(i, 1);
            const value = c.value || 1;
            planeState.score += value;
            STATE.balance += value;
            STATE.totalEarned += value;
            if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
            sfxPlaneCoin();
            addExp(rand(10, 20));
        }
    }

    updatePlaneUI();
    drawPlane();
    planeAnimId = requestAnimationFrame(planeLoop);
}

function drawPlane() {
    const canvas = document.getElementById('planeCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 600, 300);
    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, '#1a3a6a');
    gradient.addColorStop(1, '#4a8aba');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 600, 300);

    for (const o of planeState.obstacles) {
        ctx.fillStyle = '#cc3333';
        ctx.fillRect(o.x, o.y, o.width, o.height);
        ctx.fillStyle = '#aa2222';
        ctx.fillRect(o.x-2, o.y+2, o.width+4, 4);
        ctx.fillRect(o.x-2, o.y+o.height-6, o.width+4, 4);
    }

    for (const c of planeState.coins) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2);
        ctx.fillStyle = '#f0d070';
        ctx.fill();
        ctx.strokeStyle = '#aa8822';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    const p = planeState;
    ctx.fillStyle = '#ece9d8';
    ctx.fillRect(p.planeX, p.planeY, p.width, p.height);
    ctx.fillStyle = '#0a246a';
    ctx.fillRect(p.planeX + p.width - 8, p.planeY - 4, 12, 6);
    ctx.fillRect(p.planeX - 6, p.planeY + 6, 8, 6);
    ctx.fillStyle = '#4a8aba';
    ctx.fillRect(p.planeX + 4, p.planeY + 4, 6, 6);

    if (planeState.gameOver) {
        ctx.fillStyle = 'rgba(255,0,0,0.3)';
        ctx.fillRect(0, 0, 600, 300);
        ctx.fillStyle = '#ff3333';
        ctx.font = '28px Tahoma';
        ctx.textAlign = 'center';
        ctx.fillText('КРАХ', 300, 120);
    }
}

function updatePlaneUI() {
    document.getElementById('planeCoins').textContent = Math.floor(planeState.score);
    document.getElementById('planeXP').textContent = Math.floor(planeState.xp);
    document.getElementById('planeTime').textContent = Math.floor(planeState.time);
}

function initLudka() {
    try {
        const betBtns = document.querySelectorAll('#ludkaBetContainer button');
        betBtns.forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('#ludkaBetContainer button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                STATE.ludkaBet = parseInt(this.dataset.bet);
                document.getElementById('ludkaBalance').textContent = STATE.balance;
            };
        });
        document.getElementById('ludkaResetBtn').onclick = resetLudka;
        resetLudka();
    } catch(e) { console.warn('initLudka error:', e); addLog('⚠️ Ошибка инициализации Лудки: ' + e.message); }
}

function resetLudka() {
    STATE.ludkaGrid = Array(9).fill(null);
    STATE.ludkaRevealed = Array(9).fill(false);
    STATE.ludkaClicks = 0;
    STATE.ludkaGameOver = false;
    STATE.ludkaWon = false;
    document.getElementById('ludkaWinDisplay').textContent = '0';
    STATE.ludkaBombs = [];
    while (STATE.ludkaBombs.length < 3) {
        const pos = rand(0, 8);
        if (!STATE.ludkaBombs.includes(pos)) STATE.ludkaBombs.push(pos);
    }
    renderLudka();
    updateLudkaUI();
}

function renderLudka() {
    const grid = document.getElementById('ludkaGrid');
    if (!grid) return;
    grid.innerHTML = '';
    for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'mine-cell';
        if (STATE.ludkaRevealed[i]) {
            cell.classList.add('revealed');
            if (STATE.ludkaBombs.includes(i)) {
                cell.classList.add('bomb');
                cell.textContent = '💣';
            } else {
                cell.classList.add('safe');
                cell.textContent = '✅';
            }
        }
        cell.dataset.index = i;
        cell.onclick = function() { ludkaClick(parseInt(this.dataset.index)); };
        grid.appendChild(cell);
    }
}

function ludkaClick(index) {
    if (STATE.ludkaGameOver || STATE.ludkaRevealed[index]) return;
    if (STATE.ludkaClicks >= 3) return;
    if (STATE.balance < STATE.ludkaBet) {
        showToast('Недостаточно монет для ставки');
        return;
    }

    if (STATE.ludkaClicks === 0) {
        STATE.balance -= STATE.ludkaBet;
        STATE.totalSpent += STATE.ludkaBet;
        updateUI();
        document.getElementById('ludkaBalance').textContent = STATE.balance;
    }

    STATE.ludkaRevealed[index] = true;
    STATE.ludkaClicks++;

    if (STATE.ludkaBombs.includes(index)) {
        STATE.ludkaGameOver = true;
        STATE.ludkaWon = false;
        sfxLudkaLose();
        showToast('💥 Вы попали на бомбу! Ставка потеряна.');
        renderLudka();
        updateLudkaUI();
        return;
    } else {
        sfxClick();
        renderLudka();
        updateLudkaUI();
        if (STATE.ludkaClicks === 3) {
            const win = STATE.ludkaBet * 2;
            STATE.balance += win;
            STATE.totalEarned += win;
            if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
            STATE.ludkaGameOver = true;
            STATE.ludkaWon = true;
            sfxLudkaWin();
            showToast('🎉 Вы выиграли ' + win + ' монет!');
            document.getElementById('ludkaWinDisplay').textContent = win;
            updateUI();
            saveStateToFirebase();
            renderLudka();
            updateLudkaUI();
        }
    }
}

function updateLudkaUI() {
    document.getElementById('ludkaBalance').textContent = STATE.balance;
    if (STATE.ludkaGameOver && STATE.ludkaWon) {
        document.getElementById('ludkaWinDisplay').textContent = STATE.ludkaBet * 2;
    }
}

function getLevelForExp(exp) {
    if (exp < 60) return 1;
    if (exp < 140) return 2;
    if (exp < 260) return 3;
    if (exp < 420) return 4;
    if (exp < 620) return 5;
    if (exp < 860) return 6;
    if (exp < 1140) return 7;
    if (exp < 1460) return 8;
    if (exp < 1820) return 9;
    if (exp < 2220) return 10;
    return 11;
}
function getLevelLabel(level) { return level <= 10 ? level : 'Pro'; }

function updateProProgress() {
    const exp = STATE.exp;
    const level = STATE.level;
    const nextExp = level >= 11 ? Infinity : [60,140,260,420,620,860,1140,1460,1820,2220][level-1] || Infinity;
    const prevExp = level === 1 ? 0 : [0,60,140,260,420,620,860,1140,1460,1820][level-1] || 0;
    const progress = nextExp === Infinity ? 100 : Math.min(100, ((exp - prevExp) / (nextExp - prevExp) * 100));
    const expEl = document.getElementById('expDisplay');
    const progEl = document.getElementById('proProgressDisplay');
    if (expEl) expEl.textContent = exp;
    if (progEl) progEl.textContent = (level >= 11) ? 'Pro' : Math.round(progress) + '%';
}

function addExp(amount) {
    if (!currentUser) return;
    const reduced = Math.floor(amount / 3);
    if (reduced < 1) return;
    STATE.exp += reduced;
    const newLevel = getLevelForExp(STATE.exp);
    if (newLevel !== STATE.level) {
        STATE.level = newLevel;
        showToast('🎉 Уровень повышен до ' + getLevelLabel(STATE.level) + '!');
        giveLevelReward(newLevel);
        checkAllAchievements();
        saveStateToFirebase();
    }
    updateUI();
}

function giveLevelReward(level) {
    if (!currentUser) return;
    let reward = { cases: [], coins: 0 };
    switch(level) {
        case 1: reward = { cases: [{ id: 'muzhiki1', count: 3 }], coins: 100 }; break;
        case 2: reward = { cases: [{ id: 'players', count: 3 }], coins: 100 }; break;
        case 3: reward = { cases: [{ id: 'cities', count: 3 }], coins: 125 }; break;
        case 4: reward = { cases: [{ id: 'players', count: 3 }, { id: 'cities', count: 2 }], coins: 100 }; break;
        case 5: reward = { cases: CASES.map(c => ({ id: c.id, count: 1 })), coins: 150 }; break;
        case 6: reward = { cases: CASES.map(c => ({ id: c.id, count: 1 })), coins: 150 }; break;
        case 7: reward = { cases: [...CASES.map(c => ({ id: c.id, count: 1 })), { id: 'cities', count: 2 }], coins: 150 }; break;
        case 8: reward = { cases: [{ id: 'muzhiki1', count: 5 }, { id: 'muzhiki2', count: 5 }], coins: 200 }; break;
        case 9: reward = { cases: CASES.map(c => ({ id: c.id, count: 2 })), coins: 200 }; break;
        case 10: reward = { cases: CASES.map(c => ({ id: c.id, count: 2 })), coins: 250 }; break;
        case 11: reward = { cases: CASES.map(c => ({ id: c.id, count: 3 })), coins: 300 }; break;
        default: return;
    }
    for (const item of reward.cases) {
        const caseData = CASES.find(c => c.id === item.id);
        if (caseData) {
            STATE.freeOpens += item.count;
            showToast(`🎁 +${item.count} открытий кейса "${caseData.name}"!`);
        }
    }
    STATE.balance += reward.coins;
    STATE.totalEarned += reward.coins;
    showToast(`💰 +${reward.coins} монет!`);
    updateUI();
    saveStateToFirebase();
}

let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function playTone(freq, duration, type = 'sine', volume = 0.1) {
    if (!STATE.settings.sound && !STATE.settings.sfx) return;
    const vol = (STATE.settings.sfxVolume || 1) * volume;
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}
function sfxClick() { if (STATE.settings.sfx) playTone(800, 0.06, 'sine', 0.08); }
function sfxCaseOpenStart() { if (STATE.settings.sfx) { playTone(500, 0.08, 'square', 0.05); setTimeout(() => playTone(600, 0.08, 'square', 0.05), 100); } }
function sfxCaseOpenFinish() { if (STATE.settings.sfx) { playTone(800, 0.1, 'sine', 0.1); setTimeout(() => playTone(1000, 0.15, 'sine', 0.12), 150); } }
function sfxMarketSell() { if (STATE.settings.sfx) { playTone(600, 0.08, 'sine', 0.08); setTimeout(() => playTone(900, 0.1, 'sine', 0.08), 120); } }
function sfxMarketBuy() { if (STATE.settings.sfx) { playTone(700, 0.08, 'sine', 0.08); setTimeout(() => playTone(1000, 0.12, 'sine', 0.1), 150); } }
function sfxAchievement() { if (STATE.settings.sfx) { [0,100,200,300,400].forEach((t,i) => setTimeout(() => playTone(500+i*150, 0.1, 'sine', 0.08), t)); } }
function sfxClicker() { if (STATE.settings.sfx) { playTone(1000, 0.05, 'sine', 0.06); } }
function sfxMorolsCoin() { if (STATE.settings.sfx) { playTone(1200, 0.05, 'sine', 0.06); } }

function getEmail(nick) { return nick + '@casettp.firebaseapp.com'; }

function loginUser(nick, password) {
    const status = document.getElementById('loginError');
    status.textContent = '';
    addLog('⏳ Попытка входа для ' + nick);
    const email = getEmail(nick);

    fetch(AUTH_URL + ':signInWithPassword?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, returnSecureToken: true })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            addLog('❌ Ошибка: ' + data.error.message);
            status.textContent = '❌ ' + data.error.message;
            status.className = 'error';
            document.getElementById('loadingStatus').classList.add('hidden');
            return;
        }
        const uid = data.localId;
        const idToken = data.idToken;
        addLog('✅ Аутентификация успешна, UID: ' + uid);
        return fetch(DB_URL + '/users/' + uid + '.json?auth=' + idToken)
            .then(res => res.json())
            .then(profile => {
                if (!profile || profile.nickname !== nick) {
                    addLog('❌ Профиль не найден или ник не совпадает');
                    status.textContent = '❌ Неверный ник или пароль';
                    status.className = 'error';
                    document.getElementById('loadingStatus').classList.add('hidden');
                    return;
                }
                addLog('✅ Профиль загружен, ник: ' + profile.nickname);
                currentUser = { uid, data: profile, idToken };
                onAuthSuccess();
            });
    })
    .catch(err => {
        addLog('❌ Исключение: ' + err.message);
        status.textContent = '❌ ' + err.message;
        status.className = 'error';
        document.getElementById('loadingStatus').classList.add('hidden');
    });
}

function getCaseById(id) { return CASES.find(c => c.id === id); }

function rollItem(caseData) {
    const total = caseData.items.reduce((s, i) => s + i.weight, 0);
    let r = Math.random() * total;
    for (const item of caseData.items) {
        r -= item.weight;
        if (r <= 0) return { ...item };
    }
    return { ...caseData.items[0] };
}

function openCase(caseId) {
    if (STATE.isOpening) return;
    const caseData = getCaseById(caseId);
    if (!caseData) return;
    let price = caseData.price;
    let free = false;
    if (STATE.freeOpens > 0) {
        free = true;
        STATE.freeOpens--;
        price = 0;
    } else if (STATE.balance < price) {
        showToast('Недостаточно монет! Нужно ' + price + ' ₽');
        return;
    }
    STATE.isOpening = true;
    STATE.currentCaseId = caseId;
    sfxCaseOpenStart();
    const modal = document.getElementById('caseModal');
    const track = document.getElementById('slotTrack');
    const resultDisplay = document.getElementById('resultDisplay');
    const reopenBtn = document.getElementById('reopenBtn');
    const sellResultBtn = document.getElementById('sellResultBtn');

    document.getElementById('modalCaseName').textContent = caseData.name;
    modal.classList.add('open');
    reopenBtn.style.display = 'none';
    sellResultBtn.style.display = 'none';

    const allItems = caseData.items;
    let spinItems = [];
    for (let i=0; i<30; i++) spinItems.push(pickRandom(allItems));
    const result = rollItem(caseData);
    spinItems.push(result);
    for (let i=0; i<10; i++) spinItems.push(pickRandom(allItems));
    spinItems.push(result);

    track.innerHTML = '';
    spinItems.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'slot-item';
        div.dataset.idx = idx;
        div.innerHTML = `<span class="emoji">${item.emoji}</span> ${item.name}`;
        track.appendChild(div);
    });

    const itemWidth = 120;
    const visibleCount = 3;
    const containerWidth = itemWidth * visibleCount;
    document.getElementById('slotContainer').style.width = containerWidth + 'px';
    document.getElementById('slotContainer').style.margin = '0 auto';

    let startTime = null;
    const duration = 2800;
    const centerIndex = spinItems.length - 2;
    const endOffset = -(centerIndex - 1) * itemWidth;

    function animateScroll(time) {
        if (!startTime) startTime = time;
        const progress = Math.min((time - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentOffset = 0 + (endOffset - 0) * eased;
        track.style.transform = 'translateX(' + currentOffset + 'px)';
        const items = track.querySelectorAll('.slot-item');
        const centerIdx = Math.round(-currentOffset / itemWidth) + 1;
        items.forEach((el, i) => {
            el.classList.remove('active', 'highlight');
            if (i === centerIdx) el.classList.add('active');
            if (i === spinItems.length - 1 && progress >= 0.99) el.classList.add('highlight');
        });
        if (progress < 1) {
            requestAnimationFrame(animateScroll);
        } else {
            track.style.transform = 'translateX(' + endOffset + 'px)';
            const finalResult = spinItems[centerIndex];
            resultDisplay.innerHTML = `
                <span class="big-emoji">${finalResult.emoji}</span>
                <span class="result-name">${finalResult.name}</span>
                <span class="result-rare">${finalResult.rarity || 'обычное'}</span>
            `;
            if (!free) {
                STATE.balance -= price;
                STATE.totalSpent += price;
            } else {
                showToast('🎁 Бесплатное открытие!');
            }
            STATE.casesOpened += 1;
            if (STATE.casesOpened > STATE.maxCasesOpened) STATE.maxCasesOpened = STATE.casesOpened;
            const entry = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2,6),
                name: finalResult.name,
                emoji: finalResult.emoji,
                rarity: finalResult.rarity || 'обычное',
                caseId: caseData.id,
                acquired: Date.now(),
            };
            STATE.inventory.push(entry);
            const key = finalResult.name + '|||' + finalResult.emoji;
            STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) + 1;
            addExp(10);
            updateUI();
            checkAllAchievements();
            sfxCaseOpenFinish();
            STATE.isOpening = false;
            reopenBtn.style.display = 'block';
            sellResultBtn.style.display = 'block';
            sellResultBtn.textContent = 'Продать за ' + (Math.floor(caseData.price * 0.5)) + ' ₽';
            sellResultBtn.onclick = function() {
                const price = Math.floor(caseData.price * 0.5);
                const idx = STATE.inventory.findIndex(item => item.id === entry.id);
                if (idx !== -1) {
                    STATE.inventory.splice(idx, 1);
                    STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                    if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                    STATE.balance += price;
                    STATE.totalEarned += price;
                    if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
                    showToast('✅ Продано: ' + finalResult.emoji + ' ' + finalResult.name + ' за ' + price + ' ₽');
                    sfxMarketSell();
                    updateUI();
                    saveStateToFirebase();
                    renderInventory();
                    closeCaseModal();
                }
            };
            reopenBtn.onclick = function() {
                closeCaseModal();
                setTimeout(() => openCase(caseId), 100);
            };
            saveStateToFirebase();
        }
    }
    requestAnimationFrame(animateScroll);

    document.getElementById('caseModalClose').onclick = function() {
        closeCaseModal();
    };

    modal.onclick = function(e) {
        if (e.target === modal) closeCaseModal();
    };
}

    const list = document.getElementById('chanceList');

    const total = caseData.items.reduce((s,i) => s + i.weight, 0);
    for (const item of caseData.items) {

        html += `<div class="chance-item"><span class="name">${item.emoji} ${item.name}</span><span class="percent">${percent}%</span></div>`;

function renderInventory() {
    try {
        const grid = document.getElementById('inventoryGrid');
        const countEl = document.getElementById('invCount');
        const entries = Object.entries(STATE.itemsCount);
        if (entries.length === 0) {
            grid.innerHTML = `<div class="inv-empty">Инвентарь пуст</div>`;
            countEl.textContent = '0';
            return;
        }
        let html = '', total = 0;
        for (const [key, count] of entries) {
            const [name, emoji] = key.split('|||');
            const found = STATE.inventory.find(it => it.name === name && it.emoji === emoji);
            const rarity = found ? found.rarity : 'обычное';
            const caseId = found ? found.caseId : null;
            let sellPrice = 20;
            if (caseId && caseId !== 'market' && caseId !== 'unknown') {
                const caseData = getCaseById(caseId);
                if (caseData) sellPrice = Math.floor(caseData.price * 0.5);
            }
            html += `<div class="inv-item">
                <span class="item-emoji">${emoji}</span>
                <div class="item-name">${name}</div>
                <div class="item-count">×${count}</div>
                <div class="item-rarity">${rarity}</div>
                <div class="btn-group">
                    <button class="sell-btn" data-item-key="${key}" data-sell-price="${sellPrice}">Продать за ${sellPrice} ₽</button>
                    <button class="trash-btn" data-item-key="${key}">Выбросить</button>
                    <button class="clear-all-btn" data-item-key="${key}">Очистить все</button>
                </div>
            </div>`;
            total += count;
        }
        grid.innerHTML = html;
        countEl.textContent = total;

        grid.querySelectorAll('.sell-btn').forEach(btn => {
            btn.onclick = function() {
                const key = this.dataset.itemKey;
                const price = parseInt(this.dataset.sellPrice);
                const [name, emoji] = key.split('|||');
                if ((STATE.itemsCount[key] || 0) < 1) {
                    showToast('Нет предмета');
                    return;
                }
                const idx = STATE.inventory.findIndex(item => item.name === name && item.emoji === emoji);
                if (idx === -1) { showToast('Ошибка'); return; }
                STATE.inventory.splice(idx, 1);
                STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                STATE.balance += price;
                STATE.totalEarned += price;
                if (STATE.balance > STATE.maxBalance) STATE.maxBalance = STATE.balance;
                showToast('✅ Продано: ' + emoji + ' ' + name + ' за ' + price + ' ₽');
                sfxMarketSell();
                addExp(1);
                updateUI();
                saveStateToFirebase();
                renderInventory();
            };
        });

        grid.querySelectorAll('.trash-btn').forEach(btn => {
            btn.onclick = function() {
                const key = this.dataset.itemKey;
                const [name, emoji] = key.split('|||');
                if ((STATE.itemsCount[key] || 0) < 1) {
                    showToast('Нет предмета');
                    return;
                }
                const idx = STATE.inventory.findIndex(item => item.name === name && item.emoji === emoji);
                if (idx === -1) { showToast('Ошибка'); return; }
                STATE.inventory.splice(idx, 1);
                STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                showToast('🗑️ Выброшено: ' + emoji + ' ' + name);
                updateUI();
                saveStateToFirebase();
                renderInventory();
            };
        });

        grid.querySelectorAll('.clear-all-btn').forEach(btn => {
            btn.onclick = function() {
                const key = this.dataset.itemKey;
                const [name, emoji] = key.split('|||');
                const count = STATE.itemsCount[key] || 0;
                if (count === 0) { showToast('Нет предмета'); return; }
                if (!confirm(`Удалить все ${count} карточек "${name}"?`)) return;
                STATE.inventory = STATE.inventory.filter(item => !(item.name === name && item.emoji === emoji));
                delete STATE.itemsCount[key];
                showToast(`Очищено: ${emoji} ${name} (${count} шт.)`);
                updateUI();
                saveStateToFirebase();
                renderInventory();
            };
        });

        document.getElementById('clearAllInventoryBtn').onclick = clearAllInventory;
    } catch(e) { console.warn('renderInventory error:', e); addLog('⚠️ Ошибка рендера инвентаря: ' + e.message); }
}

function renderMarket() {
    const container = document.getElementById('marketContent');
    const activeTab = document.querySelector('.market-tabs .active')?.dataset.marketTab || 'buy';
    const sort = document.getElementById('marketSort').value;

    fetch(DB_URL + '/market.json')
        .then(res => res.json())
        .then(data => {
            let lots = [];
            if (data) {
                for (const key in data) {
                    const lot = data[key];
                    lot._id = key;
                    lots.push(lot);
                }
            }
            STATE.marketListings = lots;

            let filtered = lots;
            if (activeTab === 'my') {
                filtered = lots.filter(l => l.sellerUid === STATE.uid);
            } else if (activeTab === 'buy') {
                filtered = lots.filter(l => l.sellerUid !== STATE.uid);
            }

            switch(sort) {
                case 'price_asc': filtered.sort((a,b) => a.price - b.price); break;
                case 'price_desc': filtered.sort((a,b) => b.price - a.price); break;
                case 'rarity_desc': filtered.sort((a,b) => (b.rarityWeight||0) - (a.rarityWeight||0)); break;
                case 'rarity_asc': filtered.sort((a,b) => (a.rarityWeight||0) - (b.rarityWeight||0)); break;
            }

            let html = '';
            if (activeTab === 'sell') {
                html += `<div class="market-sell-form">
                    <h3>Выставить лот</h3>
                    <div class="row">
                        <select id="sellItemSelect">
                            <option value="">Выберите предмет</option>
                            ${Object.keys(STATE.itemsCount).map(key => {
                                const [name, emoji] = key.split('|||');
                                const count = STATE.itemsCount[key];
                                return `<option value="${key}">${emoji} ${name} (${count} шт.)</option>`;
                            }).join('')}
                        </select>
                        <input type="number" id="sellPriceInput" placeholder="Цена" min="1" value="50">
                        <button id="sellSubmitBtn">Выставить</button>
                    </div>
                </div>`;
            }

            if (filtered.length === 0 && activeTab !== 'sell') {
                html += `<div class="inv-empty">Нет лотов</div>`;
            } else {
                for (const lot of filtered) {
                    const isMine = lot.sellerUid === STATE.uid;
                    html += `<div class="market-listing">
                        <div class="info">
                            <span class="emoji">${lot.emoji}</span>
                            <div class="details">
                                <div class="name">${lot.name}</div>
                                <div class="seller">${isMine ? 'Вы' : lot.sellerName || 'Игрок'}</div>
                            </div>
                        </div>
                        <div class="price">
                            ${lot.price} ₽
                            ${!isMine && activeTab !== 'my' ? `<button data-lot-id="${lot._id}" class="buy-lot-btn">Купить</button>` : ''}
                            ${isMine ? `<button data-lot-id="${lot._id}" class="remove-lot-btn">✕</button>` : ''}
                        </div>
                    </div>`;
                }
            }

            container.innerHTML = html;

            container.querySelectorAll('.buy-lot-btn').forEach(btn => {
                btn.onclick = function() {
                    const lotId = this.dataset.lotId;
                    buyLot(lotId);
                };
            });
            container.querySelectorAll('.remove-lot-btn').forEach(btn => {
                btn.onclick = function() {
                    const lotId = this.dataset.lotId;
                    removeLot(lotId);
                };
            });

            const sellBtn = document.getElementById('sellSubmitBtn');
            if (sellBtn) {
                sellBtn.onclick = function() {
                    const select = document.getElementById('sellItemSelect');
                    const key = select.value;
                    if (!key) { showToast('Выберите предмет'); return; }
                    const price = parseInt(document.getElementById('sellPriceInput').value);
                    if (isNaN(price) || price < 1) { showToast('Укажите цену'); return; }
                    const [name, emoji] = key.split('|||');
                    const count = STATE.itemsCount[key] || 0;
                    if (count < 1) { showToast('Нет предмета'); return; }

                    const idx = STATE.inventory.findIndex(item => item.name === name && item.emoji === emoji);
                    if (idx === -1) { showToast('Ошибка'); return; }
                    const item = STATE.inventory[idx];

                    const lot = {
                        name: item.name,
                        emoji: item.emoji,
                        rarity: item.rarity || 'обычное',
                        price: price,
                        sellerUid: STATE.uid,
                        sellerName: STATE.nickname,
                        timestamp: Date.now(),
                        rarityWeight: ['ширп','обычное','необычное','редкое','сверхредкое','эпическое','эксклюзив'].indexOf(item.rarity) || 0
                    };
                    fetch(DB_URL + '/market.json?auth=' + currentUser.idToken, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(lot)
                    })
                    .then(res => res.json())
                    .then(() => {
                        STATE.inventory.splice(idx, 1);
                        STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) - 1;
                        if (STATE.itemsCount[key] <= 0) delete STATE.itemsCount[key];
                        STATE.marketSells++;
                        showToast('✅ Лот выставлен!');
                        sfxMarketSell();
                        updateUI();
                        saveStateToFirebase();
                        renderInventory();
                        renderMarket();
                    })
                    .catch(err => showToast('❌ Ошибка: ' + err.message));
                };
            }
        })
        .catch(err => container.innerHTML = '<div class="inv-empty">Ошибка загрузки рынка</div>');
}

function buyLot(lotId) {
    if (!currentUser) { showToast('Войдите'); return; }
    const lot = STATE.marketListings.find(l => l._id === lotId);
    if (!lot) { showToast('Лот не найден'); return; }
    if (lot.sellerUid === STATE.uid) { showToast('Это ваш лот'); return; }
    if (STATE.balance < lot.price) { showToast('Недостаточно монет'); return; }

    STATE.balance -= lot.price;
    STATE.totalSpent += lot.price;

    const entry = {
        id: Date.now() + '_' + Math.random().toString(36).slice(2,6),
        name: lot.name,
        emoji: lot.emoji,
        rarity: lot.rarity || 'обычное',
        caseId: 'market',
        acquired: Date.now()
    };
    STATE.inventory.push(entry);
    const key = lot.name + '|||' + lot.emoji;
    STATE.itemsCount[key] = (STATE.itemsCount[key] || 0) + 1;
    STATE.marketBuys++;

    fetch(DB_URL + '/market/' + lotId + '.json?auth=' + currentUser.idToken, {
        method: 'DELETE'
    })
    .then(() => {
        showToast('✅ Покупка успешна!');
        sfxMarketBuy();
        updateUI();
        saveStateToFirebase();
        renderInventory();
        renderMarket();
    })
    .catch(err => showToast('❌ Ошибка: ' + err.message));
}

function removeLot(lotId) {

    fetch(DB_URL + '/market/' + lotId + '.json?auth=' + currentUser.idToken, {

    })

        showToast('Лот снят');
